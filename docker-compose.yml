services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
      - MEMORY_TYPE=${MEMORY_TYPE:-buffer}
      - REDIS_URL=redis://redis:6379
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-3600}
      # LangFuse Configuration (use env vars for AWS deployment)
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-75f9cc1c-f591-4011-9f8d-61ea69def828}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-b2ad5f6c-adfa-4371-ad66-c8c13861d2ec}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      # OpenTelemetry Configuration
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=rady-genai-backend
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      # RAG Configuration
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - RAG_ENABLED=${RAG_ENABLED:-true}
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rady-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rady-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      # BACKEND_URL is used by Next.js server-side API proxy routes (container-to-container)
      - BACKEND_URL=http://backend:8002
      # NEXT_PUBLIC_API_URL is the browser-visible fallback (not used — all calls go via proxy)
      - NEXT_PUBLIC_API_URL=http://localhost:8002
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --port 3001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rady-network

  # ==================== CHROMADB (Vector Database for RAG) ====================
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rady-network

  # ==================== LANGFUSE (LLM Observability) ====================
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-nextauth-secret-min-32-chars}
      - SALT=${SALT:-your-salt-value-min-32-characters}
      - NEXTAUTH_URL=http://localhost:3001
      - TELEMETRY_ENABLED=false
    depends_on:
      langfuse-db:
        condition: service_healthy
    networks:
      - rady-network

  langfuse-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rady-network

  # ==================== OPENTELEMETRY (Infrastructure Monitoring) ====================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./monitoring/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
    depends_on:
      - jaeger
    networks:
      - rady-network

  jaeger:
    image: jaegertracing/all-in-one:1.52
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Accept spans
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - rady-network

  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - rady-network

  grafana:
    image: grafana/grafana:10.2.2
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/otel/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - jaeger
    networks:
      - rady-network

volumes:
  backend_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  langfuse_postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  rady-network:
    driver: bridge
